name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 2366e33e4934696424bb9f5aa7598df925fbc0c1 # UniXNU main; it carries the Turnip patch new file mode fix and every submodule at its newest main
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: Ath12kWifi sources
        working-directory: device/drivers/Ath12kWifi
        run: |
          # fetch-sources.py adds leading-slash patterns, which the runner's git rejects in cone
          # mode. Clone the locked sources in no-cone mode first; the script then verifies and fills them.
          python3 - <<'PY'
          import json, subprocess
          lock = json.load(open('tools/source-lock.json'))
          for name in ('linux', 'freebsd'):
              source, directory = lock[name], 'deps/' + name
              subprocess.run(['git', 'clone', '--depth', '1', '--branch', source['ref'], '--filter=blob:none',
                              '--sparse', source['url'], directory], check=True)
              subprocess.run(['git', '-C', directory, 'sparse-checkout', 'set', '--no-cone', '/.unixnu-placeholder'],
                             check=True)
          PY
          python3 tools/fetch-sources.py
      - name: keyboard and video firmware
        # build-gop-legacy-display-27.py needs nanosic/MCU_Upgrade.bin and stage-video-firmware.py needs
        # qcom/sm8550/sheng/vpu30_4v.mbn in .cache/firmware. extract-files.py downloads them from the pinned
        # public mirror (@fetch in proprietary-files.txt) and checks their SHA-256.
        working-directory: device
        run: |
          python3 scripts/extract-files.py --section Keyboard
          python3 scripts/extract-files.py --section Video
      - name: prelink layout report
        # Diagnostic only: XnuPrelink's collision error then names the native code end and the collection data address,
        # so a kernel that is too large reports by how much.
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('UniXNU/kits/XnuPrelink/fileset_layout.py')
          s = p.read_text()
          old = "raise ValueError('Native code would collide with collection data')"
          new = ("raise ValueError(f'Native code would collide with collection data: native __TEXT_EXEC {self.placements[\"__TEXT_EXEC\"]:#x}, '"
                 " f'code end {code_end:#x}, __DATA {self.roots[\"__DATA\"][\"va\"]:#x}, '"
                 " f'over by {code_end - self.roots[\"__DATA\"][\"va\"]} bytes')")
          if old in s:
              s = s.replace(old, new)
          old = "raise ValueError(f'Native {segment[\"name\"]} overlaps a retained segment')"
          new = ("raise ValueError(f'Native {segment[\"name\"]} overlaps a retained segment: {begin:#x}..{end:#x} meets '"
                 " + ', '.join(f'{b:#x}..{e:#x}' for b, e in self.occupied + placed if begin < e and b < end))")
          p.write_text(s.replace(old, new))
          PY
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
      - name: native kernel data report
        # Diagnostic only, after a failed package: the native kernel's __DATA sections and its largest __DATA symbols.
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re, subprocess
          kernels = glob.glob('UniXNU/out/sheng/*/*/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf')
          if not kernels:
              raise SystemExit('no native kernel')
          kernel = kernels[0]
          out = subprocess.run(['otool', '-l', kernel], capture_output=True, text=True).stdout
          for block in re.split(r'Load command|\nSection\n', out)[1:]:
              fields = dict(re.findall(r'^\s*(\w+) (\S+)$', block, re.M))
              if fields.get('segname') == '__DATA':
                  print(fields.get('sectname', 'segment'), fields.get('addr', fields.get('vmaddr')), fields.get('size', fields.get('vmsize')))
          lines = subprocess.run(['nm', '-n', '-m', kernel], capture_output=True, text=True).stdout.splitlines()
          symbols = []
          for line in lines:
              m = re.match(r'^([0-9a-f]{16}) \((__\w+),(__\w+)\) .*? (\S+)$', line)
              if m:
                  symbols.append((int(m.group(1), 16), m.group(2), m.group(3), m.group(4)))
          sized = []
          for (a, seg, sect, name), nxt in zip(symbols, symbols[1:] + [(None,) * 4]):
              if seg == '__DATA' and nxt[0] is not None and nxt[1] == '__DATA' and nxt[2] == sect:
                  sized.append((nxt[0] - a, sect, name))
          for size, sect, name in sorted(sized, reverse=True)[:120]:
              print(size, sect, name)
          PY
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: redact build logs
        if: always()
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          mkdir -p build-logs
          for d in UniXNU/out/sheng/*/*/logs; do
            [ -d "$d" ] && cp -R "$d"/. build-logs/
          done
          for f in UniXNU/out/sheng/*/*/tree/build/xnu/fileset-reference/*/*-build.log; do
            [ -f "$f" ] && cp "$f" "build-logs/fileset-reference-$(basename "$(dirname "$f")")-$(basename "$f")"
          done
          find build-logs -type f -exec sed -i '' "s/$SEED/********/g" {} + 2>/dev/null || true
      - name: build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: ignore
          path: build-logs
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
